<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="Flowchart of Expense Receipt Scanner: capture, reading on your own server, review, project, rules, submission, approval, expense sheet and accounting" font-family="Arial, Helvetica, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><rect width="1200" height="790" rx="14" fill="#FFFFFF" stroke="#E2DCE0"/><text x="40" y="46" font-size="27" fill="#2B2B2B" text-anchor="start" font-weight="700">How Expense Receipt Scanner works</text><text x="40" y="72" font-size="14.5" fill="#666" text-anchor="start">From the photo of a receipt to the posted expense. The reading happens on your own server.</text><rect x="250" y="92" width="700" height="338" rx="14" fill="#FCF8FB" stroke="#875A7B" stroke-width="1.5" stroke-dasharray="8 5"/><text x="268" y="114" font-size="11.5" fill="#875A7B" text-anchor="start" font-weight="700">ON YOUR OWN SERVER: no receipt, text or amount leaves it</text><rect x="30" y="119" width="190" height="58" rx="10" fill="#EAF1F8" stroke="#4F7BA8" stroke-width="1.6"/><text x="44" y="146" font-size="14.5" font-weight="700" fill="#2B2B2B">Phone: Scan</text><text x="44" y="166" font-size="12.5" fill="#555">Camera, gallery or files</text><rect x="30" y="189" width="190" height="58" rx="10" fill="#EAF1F8" stroke="#4F7BA8" stroke-width="1.6"/><text x="44" y="216" font-size="14.5" font-weight="700" fill="#2B2B2B">Computer: Upload</text><text x="44" y="236" font-size="12.5" fill="#555">A photo or a PDF</text><rect x="30" y="259" width="190" height="58" rx="10" fill="#EAF1F8" stroke="#4F7BA8" stroke-width="1.6"/><text x="44" y="286" font-size="14.5" font-weight="700" fill="#2B2B2B">E-mail</text><text x="44" y="306" font-size="12.5" fill="#555">Sent from a private address</text><rect x="30" y="337" width="190" height="84" rx="10" fill="#F3F3F3" stroke="#8A8A8A" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="364" font-size="14.5" font-weight="700" fill="#2B2B2B">Mileage by route</text><text x="44" y="384" font-size="12.5" fill="#555">Places, road distance, price</text><text x="44" y="400.0" font-size="12.5" fill="#555">per km. The route picture is</text><text x="44" y="416.0" font-size="12.5" fill="#555">the receipt.</text><text x="125" y="436" font-size="11" fill="#777" text-anchor="middle" font-style="italic">OSRM and Nominatim, or your own</text><rect x="270" y="128" width="190" height="96" rx="10" fill="#F5ECF3" stroke="#875A7B" stroke-width="1.6"/><circle cx="288" cy="150" r="11" fill="#875A7B"/><text x="288" y="154.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="308" y="155" font-size="14.5" font-weight="700" fill="#2B2B2B">Find the receipt</text><text x="284" y="175" font-size="12.5" fill="#555">Crop, perspective, tilt,</text><text x="284" y="191.0" font-size="12.5" fill="#555">quarter turns</text><rect x="480" y="128" width="190" height="96" rx="10" fill="#F5ECF3" stroke="#875A7B" stroke-width="1.6"/><circle cx="498" cy="150" r="11" fill="#875A7B"/><text x="498" y="154.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="518" y="155" font-size="14.5" font-weight="700" fill="#2B2B2B">Read</text><text x="494" y="175" font-size="12.5" fill="#555">PP-OCR neural networks,</text><text x="494" y="191.0" font-size="12.5" fill="#555">0.5 to 1.5 s a receipt</text><rect x="690" y="128" width="190" height="96" rx="10" fill="#F5ECF3" stroke="#875A7B" stroke-width="1.6"/><circle cx="708" cy="150" r="11" fill="#875A7B"/><text x="708" y="154.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="728" y="155" font-size="14.5" font-weight="700" fill="#2B2B2B">Extract</text><text x="704" y="175" font-size="12.5" fill="#555">Merchant, date, time, total,</text><text x="704" y="191.0" font-size="12.5" fill="#555">currency and tax, each with</text><text x="704" y="207.0" font-size="12.5" fill="#555">a confidence</text><rect x="270" y="262" width="660" height="150" rx="10" fill="#F5ECF3" stroke="#875A7B" stroke-width="1.6"/><circle cx="288" cy="284" r="11" fill="#875A7B"/><text x="288" y="288.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="308" y="289" font-size="14.5" fill="#2B2B2B" text-anchor="start" font-weight="700">Fill in the expense</text><rect x="284" y="304" width="120" height="96" rx="8" fill="#fff" stroke="#C9AFC3" stroke-width="1"/><text x="292" y="326" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="700">Category</text><text x="292" y="346" font-size="12" fill="#555" text-anchor="start">Words, brand,</text><text x="292" y="361" font-size="12" fill="#555" text-anchor="start">merchant history</text><rect x="412" y="304" width="120" height="96" rx="8" fill="#fff" stroke="#C9AFC3" stroke-width="1"/><text x="420" y="326" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="700">Pieces merged</text><text x="420" y="346" font-size="12" fill="#555" text-anchor="start">Till receipt and</text><text x="420" y="361" font-size="12" fill="#555" text-anchor="start">card slip</text><rect x="540" y="304" width="120" height="96" rx="8" fill="#fff" stroke="#C9AFC3" stroke-width="1"/><text x="548" y="326" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="700">Foreign receipts</text><text x="548" y="346" font-size="12" fill="#555" text-anchor="start">Currency and the</text><text x="548" y="361" font-size="12" fill="#555" text-anchor="start">ECB rate of the</text><text x="548" y="376" font-size="12" fill="#555" text-anchor="start">day</text><rect x="668" y="304" width="120" height="96" rx="8" fill="#fff" stroke="#C9AFC3" stroke-width="1"/><text x="676" y="326" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="700">Business meals</text><text x="676" y="346" font-size="12" fill="#555" text-anchor="start">Guests asked</text><text x="676" y="361" font-size="12" fill="#555" text-anchor="start">before submitting</text><rect x="796" y="304" width="120" height="96" rx="8" fill="#fff" stroke="#C9AFC3" stroke-width="1"/><text x="804" y="326" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="700">Trip purpose</text><text x="804" y="346" font-size="12" fill="#555" text-anchor="start">Taken from</text><text x="804" y="361" font-size="12" fill="#555" text-anchor="start">neighbouring</text><text x="804" y="376" font-size="12" fill="#555" text-anchor="start">expenses</text><rect x="985" y="262" width="185" height="150" rx="10" fill="#E7F4EB" stroke="#3C8D5B" stroke-width="1.6"/><circle cx="1003" cy="284" r="11" fill="#3C8D5B"/><text x="1003" y="288.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="1023" y="289" font-size="14.5" font-weight="700" fill="#2B2B2B">Review</text><text x="999" y="309" font-size="12.5" fill="#555">The form opens at once:</text><text x="999" y="325.0" font-size="12.5" fill="#555">the receipt beside the fields.</text><text x="999" y="341.0" font-size="12.5" fill="#555">A hint marks each doubtful</text><text x="999" y="357.0" font-size="12.5" fill="#555">field until it is corrected.</text><rect x="985" y="480" width="185" height="112" rx="10" fill="#E7F4EB" stroke="#3C8D5B" stroke-width="1.6" stroke-dasharray="6 4"/><circle cx="1003" cy="502" r="11" fill="#3C8D5B"/><text x="1003" y="506.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="1023" y="507" font-size="14.5" font-weight="700" fill="#2B2B2B">Project</text><text x="999" y="527" font-size="12.5" fill="#555">Re-invoice to the customer,</text><text x="999" y="543.0" font-size="12.5" fill="#555">or charge the project</text><text x="999" y="559.0" font-size="12.5" fill="#555">budget only (optional)</text><rect x="765" y="480" width="190" height="112" rx="10" fill="#F5ECF3" stroke="#875A7B" stroke-width="1.6"/><circle cx="783" cy="502" r="11" fill="#875A7B"/><text x="783" y="506.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text><text x="803" y="507" font-size="14.5" font-weight="700" fill="#2B2B2B">Rules</text><text x="779" y="527" font-size="12.5" fill="#555">Ceilings per meal, day and</text><text x="779" y="543.0" font-size="12.5" fill="#555">hotel, words to watch: a</text><text x="779" y="559.0" font-size="12.5" fill="#555">warning on the expense</text><rect x="545" y="480" width="190" height="112" rx="10" fill="#E7F4EB" stroke="#3C8D5B" stroke-width="1.6"/><circle cx="563" cy="502" r="11" fill="#3C8D5B"/><text x="563" y="506.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text><text x="583" y="507" font-size="14.5" font-weight="700" fill="#2B2B2B">Submit</text><text x="559" y="527" font-size="12.5" fill="#555">The module never approves</text><text x="559" y="543.0" font-size="12.5" fill="#555">an expense by itself</text><rect x="325" y="480" width="190" height="112" rx="10" fill="#FFF3DC" stroke="#C0841A" stroke-width="1.6"/><circle cx="343" cy="502" r="11" fill="#C0841A"/><text x="343" y="506.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9</text><text x="363" y="507" font-size="14.5" font-weight="700" fill="#2B2B2B">Approval</text><text x="339" y="527" font-size="12.5" fill="#555">The manager decides.</text><text x="339" y="543.0" font-size="12.5" fill="#555">Managers can also enter</text><text x="339" y="559.0" font-size="12.5" fill="#555">expenses for their team.</text><rect x="105" y="480" width="190" height="112" rx="10" fill="#FFF3DC" stroke="#C0841A" stroke-width="1.6"/><circle cx="123" cy="502" r="11" fill="#C0841A"/><text x="123" y="506.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">10</text><text x="143" y="507" font-size="14.5" font-weight="700" fill="#2B2B2B">Expense sheet</text><text x="119" y="527" font-size="12.5" fill="#555">PDF with tax by rate and</text><text x="119" y="543.0" font-size="12.5" fill="#555">numbered receipts, Excel on</text><text x="119" y="559.0" font-size="12.5" fill="#555">your template, by e-mail</text><rect x="105" y="640" width="190" height="102" rx="10" fill="#FFF3DC" stroke="#C0841A" stroke-width="1.6"/><circle cx="123" cy="662" r="11" fill="#C0841A"/><text x="123" y="666.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">11</text><text x="143" y="667" font-size="14.5" font-weight="700" fill="#2B2B2B">Accounting</text><text x="119" y="687" font-size="12.5" fill="#555">Posting. Correct VAT books</text><text x="119" y="703.0" font-size="12.5" fill="#555">only the difference.</text><path d="M220,148 H245 V176 H268" fill="none" stroke="#666" stroke-width="1.8"/><path d="M220,218 H245 V176 H268" fill="none" stroke="#666" stroke-width="1.8"/><path d="M220,288 H245 V176 H268" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M460,176 H478" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M670,176 H688" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M785,224 V260" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M220,379 H268" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M930,337 H983" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M1077,412 V478" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M985,536 H957" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M765,536 H737" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M545,536 H517" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M325,536 H297" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M200,592 V638" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#head)"/><path d="M1077,262 V244 H905 V260" fill="none" stroke="#875A7B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="1170" y="238" font-size="11.5" fill="#875A7B" text-anchor="end" font-style="italic">your corrections teach the category</text><text x="400" y="668" font-size="12" fill="#555" text-anchor="start" font-weight="700">Colours</text><rect x="400" y="677" width="22" height="14" rx="3" fill="#E7F4EB" stroke="#3C8D5B" stroke-width="1.4"/><text x="432" y="688" font-size="12.5" fill="#444" text-anchor="start">Employee</text><rect x="400" y="701" width="22" height="14" rx="3" fill="#F5ECF3" stroke="#875A7B" stroke-width="1.4"/><text x="432" y="712" font-size="12.5" fill="#444" text-anchor="start">Your server</text><rect x="400" y="725" width="22" height="14" rx="3" fill="#FFF3DC" stroke="#C0841A" stroke-width="1.4"/><text x="432" y="736" font-size="12.5" fill="#444" text-anchor="start">Manager and accounting</text><rect x="630" y="677" width="22" height="14" rx="3" fill="#EAF1F8" stroke="#4F7BA8" stroke-width="1.4"/><text x="662" y="688" font-size="12.5" fill="#444" text-anchor="start">Capture</text><rect x="630" y="701" width="22" height="14" rx="3" fill="#F3F3F3" stroke="#8A8A8A" stroke-width="1.4"/><text x="662" y="712" font-size="12.5" fill="#444" text-anchor="start">Outside service</text><text x="400" y="770" font-size="12.5" fill="#666" text-anchor="start">Free module, LGPL-3. No API key, no account, no fee per scan.</text><text x="1170" y="770" font-size="12.5" fill="#666" text-anchor="end">Eleven interface languages</text></svg>